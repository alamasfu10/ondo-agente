[project]
name = "ondo-agente"
version = "0.1.0"
description = "Agente de atención al cliente de Ondo (caso ficticio del Tema 10 del MAU de EBIS)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "langchain>=1.0",
    "langchain-mcp-adapters>=0.1.9",
    "langchain-openai>=1.0",
    "langgraph>=1.0",
    "mcp>=1.12",
    "numpy>=2.4.6",
    "python-dotenv>=1.0",
    "python-telegram-bot>=21.0",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
